name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: ${{ matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: '8.5'
            swoole_tag: php8.5
            latest: true
          - tag: '8.4'
            swoole_tag: 6.2.1-php8.4
            latest: false
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            SWOOLE_TAG=${{ matrix.swoole_tag }}
          tags: |
            ghcr.io/bumpcore/php-swoole-bun:${{ matrix.tag }}
            ${{ matrix.latest && 'ghcr.io/bumpcore/php-swoole-bun:latest' || '' }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
